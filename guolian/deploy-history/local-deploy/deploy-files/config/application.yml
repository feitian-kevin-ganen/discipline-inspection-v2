server:
  port: 8088

spring:
  application:
    name: exam-server
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5434/exam_db?stringtype=unspecified
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

exam:
  jwt:
    secret: 9f4c2a7b8d1e3f5061728394a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8
    access-expire-seconds: 43200
    refresh-expire-seconds: 604800
  minio:
    endpoint: http://127.0.0.1:9000
    # 预签名 URL 对外地址（外网可达）；不配置则回退 endpoint
    public-endpoint: http://10.110.40.160:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: exam-files
  # ffmpeg 可执行文件路径：视频资料上传时自动抽帧生成封面；默认取 PATH 中的 ffmpeg
  ffmpeg-path: /home/cloud/AIExamK3/middleware/ffmpeg

logging:
  level:
    root: info
    com.group.exam: info
    com.group.exam.system.mapper: debug
    com.group.exam.question.mapper: debug
    com.group.exam.learn.mapper: debug
    com.group.exam.exam.mapper: debug
    com.group.exam.stat.mapper: debug
