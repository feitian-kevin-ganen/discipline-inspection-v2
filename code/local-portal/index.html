<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字国联（本机模拟门户）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #12395e 0%, #1f5f8b 100%);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .card {
      width: 380px; padding: 34px 32px; border-radius: 12px; background: #fff;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    }
    .title { font-size: 20px; color: #12395e; font-weight: 700; text-align: center; }
    .subtitle { margin-top: 8px; font-size: 12px; color: #8a94a6; text-align: center; }
    label { display: block; margin-top: 20px; font-size: 13px; color: #4a5568; }
    input {
      width: 100%; margin-top: 6px; padding: 10px 12px; font-size: 14px;
      border: 1px solid #d7dee8; border-radius: 6px; outline: none;
    }
    input:focus { border-color: #2b6cb0; }
    button {
      width: 100%; margin-top: 24px; padding: 11px 0; font-size: 15px; color: #fff;
      background: #1f5f8b; border: none; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #17496b; }
    button:disabled { background: #9db4c6; cursor: not-allowed; }
    .tip { margin-top: 14px; font-size: 12px; color: #8a94a6; text-align: center; }
    .error { margin-top: 12px; font-size: 13px; color: #c53030; text-align: center; }
    .hidden { display: none; }

    .apps { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 8px; }
    .app {
      display: flex; align-items: center; gap: 14px; padding: 16px;
      border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer;
      transition: all 0.15s ease;
    }
    .app:hover { border-color: #1f5f8b; box-shadow: 0 6px 18px rgba(31, 95, 139, 0.15); transform: translateY(-1px); }
    .app-icon {
      width: 44px; height: 44px; border-radius: 10px; background: #1f5f8b; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;
    }
    .app-name { font-size: 15px; color: #1a202c; font-weight: 600; }
    .app-desc { margin-top: 4px; font-size: 12px; color: #8a94a6; }
    .userbar { margin-top: 18px; font-size: 12px; color: #4a5568; text-align: center; }
    .logout { margin-left: 10px; color: #2b6cb0; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loginView">
      <div class="title">数字国联</div>
      <div class="subtitle">本机模拟门户（密码不做校验）</div>
      <label for="phone">手机号</label>
      <input id="phone" type="tel" placeholder="请输入手机号" autocomplete="username" />
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="任意密码" autocomplete="current-password" />
      <button id="loginBtn">登 录</button>
      <div class="error hidden" id="error"></div>
      <div class="tip">管理员 13822211100 ／ 员工 13585020876</div>
    </div>

    <div id="appView" class="hidden">
      <div class="title">应用中心</div>
      <div class="subtitle">点击应用进入单点登录</div>
      <div class="apps">
        <div class="app" id="examApp">
          <div class="app-icon">纪</div>
          <div>
            <div class="app-name">纪检监察业务学习平台</div>
            <div class="app-desc">考试 · 学习 · 练兵</div>
          </div>
        </div>
      </div>
      <div class="userbar">
        <span id="userName"></span>
        <span class="logout" id="logout">退出</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var loginView = document.getElementById('loginView');
      var appView = document.getElementById('appView');
      var errorBox = document.getElementById('error');
      var loginBtn = document.getElementById('loginBtn');
      var ticket = null;

      function showError(text) {
        errorBox.textContent = text;
        errorBox.classList.remove('hidden');
      }

      function login() {
        var phone = document.getElementById('phone').value.trim();
        var password = document.getElementById('password').value;
        if (!phone) { showError('请输入手机号'); return; }
        errorBox.classList.add('hidden');
        loginBtn.disabled = true;
        loginBtn.textContent = '登录中…';
        fetch('/api/v1/portal/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phone, password: password })
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (!res || res.code !== 0) {
              showError((res && res.message) || '登录失败');
              return;
            }
            ticket = res.data.ticket;
            document.getElementById('userName').textContent =
              (res.data.userName || '') + '（' + (res.data.empId || '') + '）';
            loginView.classList.add('hidden');
            appView.classList.remove('hidden');
          })
          .catch(function () { showError('网络异常，请稍后重试'); })
          .finally(function () {
            loginBtn.disabled = false;
            loginBtn.textContent = '登 录';
          });
      }

      loginBtn.addEventListener('click', login);
      document.getElementById('password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') login();
      });

      document.getElementById('examApp').addEventListener('click', function () {
        if (!ticket) { return; }
        location.href = '/guolian-jijian/login?ticket=' + encodeURIComponent(ticket);
      });

      document.getElementById('logout').addEventListener('click', function () {
        ticket = null;
        appView.classList.add('hidden');
        loginView.classList.remove('hidden');
      });
    })();
  </script>
</body>
</html>
