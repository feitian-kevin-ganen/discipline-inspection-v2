<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数字国联</title>
<style>
  :root{
    --brand:#157DDD;
    --brand-dark:#0E63B4;
    --ink:#1F2733;
    --muted:#8A94A6;
    --line:#E3EAF3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",Arial,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  .hidden{display:none !important}

  /* ============ 登录页 ============ */
  .login-page{
    position:relative;
    min-height:100vh;
    overflow:hidden;
    background:
      radial-gradient(1100px 700px at 8% 18%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(900px 620px at 38% 92%, rgba(35,120,190,.45), transparent 62%),
      linear-gradient(118deg,#D3E5F5 0%,#A9CCE9 38%,#7DB4DE 68%,#4E8FC4 100%);
  }
  .login-page::before{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(closest-side at 68% 78%, rgba(21,125,221,.30), transparent),
      radial-gradient(closest-side at 22% 30%, rgba(255,255,255,.35), transparent);
    filter:blur(2px);
    pointer-events:none;
  }
  /* 画面左侧的抽象“城市/人物”层，替代设计稿中的实景照片 */
  .scene{position:absolute;inset:0;pointer-events:none;opacity:.9}
  .scene svg{width:100%;height:100%;display:block}
  .page-logo{
    position:absolute;left:9.8%;top:11.5%;z-index:2;color:#fff;
    display:flex;align-items:center;gap:14px;
    text-shadow:0 2px 10px rgba(12,52,86,.28);
  }
  .logo-mark{
    width:46px;height:46px;border-radius:12px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(2px);
  }
  .logo-mark svg{width:26px;height:26px}
  .logo-words{line-height:1.12}
  .logo-cn{font-size:24px;font-weight:700;letter-spacing:3px}
  .logo-en{font-size:10px;letter-spacing:4.2px;opacity:.85;margin-top:4px}

  .login-wrap{
    position:relative;z-index:3;min-height:100vh;
    display:flex;align-items:center;justify-content:flex-end;
    padding:0 16.2% 0 32px;
  }
  .login-card{
    width:418px;max-width:100%;
    background:#F4F8FC;
    border-radius:10px;
    box-shadow:0 24px 60px rgba(12,52,86,.28), 0 2px 0 rgba(255,255,255,.7) inset;
    padding:40px 48px 34px;
  }
  .login-card h1{
    font-size:25px;font-weight:700;color:#16202E;letter-spacing:.5px;
    margin:22px 0 44px;
  }
  .card-emblem{height:26px;display:flex;align-items:center;gap:9px;color:#24507C}
  .card-emblem .dot{
    width:22px;height:22px;border-radius:7px;background:linear-gradient(140deg,#2B8BE6,#0E5FB0);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;
  }
  .card-emblem span{font-size:12px;letter-spacing:2px;color:#6E7F94}

  .field{position:relative;margin-bottom:18px}
  .field input{
    width:100%;height:46px;padding:0 14px;
    font-size:14px;color:var(--ink);
    background:#fff;border:1px solid #E1E8F1;border-radius:4px;
    outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .field input::placeholder{color:#9AA7B8}
  .field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,125,221,.12)}
  .field .eye{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border:0;background:transparent;cursor:pointer;color:#A6B3C4;
    display:flex;align-items:center;justify-content:center;
  }
  .btn-login{
    width:100%;height:49px;margin-top:20px;
    background:var(--brand);color:#fff;border:0;border-radius:4px;
    font-size:16px;letter-spacing:4px;cursor:pointer;
    transition:background .15s,box-shadow .15s;
  }
  .btn-login:hover{background:var(--brand-dark);box-shadow:0 8px 20px rgba(21,125,221,.28)}
  .btn-login:disabled{background:#9DC4E6;cursor:not-allowed;box-shadow:none}

  .login-row{
    margin-top:22px;display:flex;align-items:center;justify-content:space-between;
    font-size:13px;color:#5E6B7C;
  }
  .login-row a{color:#4A5A6E;text-decoration:none;cursor:pointer}
  .login-row a:hover{color:var(--brand)}
  .remember{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .remember input{
    appearance:none;width:14px;height:14px;border:1px solid #B9C6D6;border-radius:3px;
    background:#fff;cursor:pointer;position:relative;
  }
  .remember input:checked{background:var(--brand);border-color:var(--brand)}
  .remember input:checked::after{
    content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg);
  }
  .download{
    margin-top:52px;text-align:center;font-size:14px;color:#54637A;
    letter-spacing:.5px;cursor:pointer;
  }
  .download:hover{color:var(--brand)}
  .download small{display:block;margin-top:6px;font-size:11px;color:#9AA7B8;letter-spacing:0}
  .login-error{
    margin-top:14px;font-size:13px;color:#D64545;min-height:18px;text-align:center;
  }

  /* ============ 应用中心 ============ */
  .portal-page{min-height:100vh;background:#F6F8FD;padding:20px}
  .shell{
    max-width:1904px;margin:0 auto;background:#fff;border-radius:10px;overflow:hidden;
    box-shadow:0 6px 26px rgba(23,48,84,.06);
  }
  .topbar{
    height:62px;display:flex;align-items:center;gap:6px;padding-right:18px;
    background:linear-gradient(90deg,#FFFFFF 0%,#FFFFFF 47%,#3A3F9E 78%,#1B1E74 100%);
    position:relative;
  }
  .topbar::after{
    content:"";position:absolute;right:0;top:0;width:38%;height:100%;
    background:
      radial-gradient(220px 90px at 78% 20%, rgba(221,18,172,.55), transparent 70%),
      radial-gradient(260px 100px at 96% 90%, rgba(57,72,221,.55), transparent 70%);
    pointer-events:none;
  }
  .brand-inline{
    display:flex;align-items:center;gap:9px;padding:0 26px 0 22px;color:#22285F;font-weight:700;
    letter-spacing:.5px;font-size:16px;white-space:nowrap;position:relative;z-index:1;
  }
  .brand-inline .mark{
    width:24px;height:24px;border-radius:50%;
    background:linear-gradient(140deg,#4E8FE8,#1E4FB0);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;font-weight:700;
  }
  .nav{display:flex;align-items:center;height:100%;gap:4px;position:relative;z-index:1}
  .nav a{
    height:100%;display:flex;align-items:center;padding:0 18px;
    font-size:14px;color:#3C4A5F;text-decoration:none;position:relative;white-space:nowrap;
  }
  .nav a:hover{color:var(--brand)}
  .nav a.active{color:var(--brand);font-weight:600}
  .nav a.active::after{
    content:"";position:absolute;left:18px;right:18px;bottom:0;height:2px;background:var(--brand);
    border-radius:2px 2px 0 0;
  }
  .topbar .spacer{flex:1}
  .user-area{
    position:relative;z-index:1;display:flex;align-items:center;gap:14px;
    color:#fff;font-size:13px;padding-left:16px;
  }
  .user-area .avatar{
    width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);
    border:1px solid rgba(255,255,255,.6);
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  .user-area button{
    background:transparent;border:0;color:rgba(255,255,255,.9);font-size:13px;cursor:pointer;
    padding:4px 6px;border-radius:4px;
  }
  .user-area button:hover{background:rgba(255,255,255,.16);color:#fff}

  .kpi-strip{
    background:#EDF4FF;padding:20px 24px 16px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  }
  .kpi{padding:0 24px;position:relative}
  .kpi + .kpi::before{
    content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:rgba(31,72,120,.12);
  }
  .kpi .val{
    font-size:23px;font-weight:700;color:#152A44;letter-spacing:.3px;
    display:flex;align-items:baseline;gap:8px;
  }
  .kpi .val i{font-style:normal;font-size:12px;font-weight:400;color:#6C7C90}
  .kpi .lbl{margin-top:8px;font-size:13px;color:#5A6B80}

  .panels{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;
    padding:18px 20px 4px;background:#F6F8FD;
  }
  .panel{
    background:#fff;border-radius:8px;min-height:360px;
    padding:18px 18px 10px;display:flex;flex-direction:column;
  }
  .panel h3{font-size:15px;color:#2A3546;font-weight:600;display:flex;align-items:center;gap:8px}
  .panel h3 span{font-weight:400;font-size:12px;color:#93A1B3}
  .panel .body{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 0}
  .panel svg{width:100%;height:auto;display:block}
  .panel .legend{
    display:flex;flex-wrap:wrap;gap:16px;justify-content:center;
    font-size:12px;color:#6B7A8F;padding:4px 0 8px;
  }
  .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .masked{display:flex;flex-direction:column;align-items:center;gap:10px;color:#9AA7B8;font-size:13px}
  .masked svg{width:72px;height:72px}

  .apps-wrap{padding:14px 20px 26px;background:#F6F8FD}
  .apps-title{font-size:16px;font-weight:700;color:#222C3C;margin-bottom:14px}
  .apps{
    background:#fff;border-radius:8px;
    display:grid;grid-template-columns:repeat(8,1fr);
    padding:22px 12px 18px;
  }
  .app{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:8px 4px;border-radius:8px;cursor:pointer;border:1px solid transparent;
    transition:background .15s,transform .15s;
  }
  .app:hover{background:#F5F9FF;transform:translateY(-2px)}
  .app .icon{
    width:56px;height:56px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(23,48,84,.14);
  }
  .app .icon svg{width:28px;height:28px}
  .app .name{font-size:13.5px;color:#3A4659;text-align:center;line-height:1.3}
  .app.exam .name{color:#0E63B4;font-weight:600}
  .app .badge{
    position:relative;top:-4px;font-size:10px;color:#fff;background:var(--brand);
    border-radius:9px;padding:1px 7px;letter-spacing:.5px;
  }

  .toast{
    position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(12px);
    background:rgba(28,38,52,.9);color:#fff;font-size:13px;
    padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:1180px){
    .panels{grid-template-columns:1fr 1fr}
    .apps{grid-template-columns:repeat(4,1fr);row-gap:14px}
    .kpi-strip{grid-template-columns:1fr 1fr;row-gap:16px}
    .kpi:nth-child(3)::before{display:none}
  }
  @media (max-width:820px){
    .login-wrap{justify-content:center;padding:0 20px}
    .page-logo{left:24px;top:26px}
    .panels{grid-template-columns:1fr}
    .topbar{height:auto;flex-wrap:wrap;padding:10px 0}
    .nav{width:100%;overflow:auto;padding:0 12px}
    .nav a{height:40px;padding:0 12px}
    .nav a.active::after{left:12px;right:12px}
    .apps{grid-template-columns:repeat(2,1fr)}
    .kpi-strip{grid-template-columns:1fr}
    .kpi + .kpi::before{display:none}
  }
</style>
</head>
<body>

<!-- ================= 登录页 ================= -->
<div class="login-page" id="loginView">
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 1920 880" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#CFE3F4"/><stop offset=".55" stop-color="#8FBCE0"/><stop offset="1" stop-color="#4B8CBE"/>
        </linearGradient>
        <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7FA6C6"/><stop offset="1" stop-color="#3D6688"/>
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#35617F"/><stop offset="1" stop-color="#223E55"/>
        </linearGradient>
      </defs>
      <rect width="1920" height="880" fill="url(#sky)"/>
      <g opacity=".55" fill="url(#bldg)">
        <rect x="60" y="470" width="150" height="410"/>
        <rect x="230" y="410" width="120" height="470"/>
        <rect x="370" y="520" width="180" height="360"/>
        <rect x="570" y="380" width="140" height="500"/>
        <rect x="730" y="470" width="200" height="410"/>
        <rect x="950" y="430" width="130" height="450"/>
        <rect x="1100" y="520" width="170" height="360"/>
        <rect x="1590" y="470" width="150" height="410"/>
        <rect x="1760" y="520" width="160" height="360"/>
      </g>
      <g opacity=".18" fill="#fff">
        <circle cx="330" cy="200" r="120"/><circle cx="1250" cy="150" r="80"/><circle cx="860" cy="120" r="46"/>
      </g>
      <rect y="790" width="1920" height="90" fill="url(#ground)" opacity=".85"/>
      <g opacity=".85" fill="#2B4759">
        <circle cx="470" cy="640" r="30"/><path d="M430 790c0-46 18-76 40-76s40 30 40 76z"/>
        <circle cx="545" cy="655" r="26"/><path d="M512 790c0-40 15-66 33-66s33 26 33 66z"/>
        <circle cx="620" cy="645" r="28"/><path d="M585 790c0-44 16-72 35-72s35 28 35 72z"/>
        <circle cx="1500" cy="650" r="26"/><path d="M1469 790c0-40 14-66 31-66s31 26 31 66z"/>
        <circle cx="1570" cy="665" r="23"/><path d="M1543 790c0-36 12-58 27-58s27 22 27 58z"/>
      </g>
      <g opacity=".12" stroke="#fff" fill="none" stroke-width="1">
        <circle cx="1490" cy="360" r="180"/><circle cx="1490" cy="360" r="240"/>
        <circle cx="1180" cy="700" r="140"/>
      </g>
    </svg>
  </div>

  <div class="page-logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.2" stroke="#fff" stroke-width="1.6"/><path d="M12 3.2v17.6M3.2 12h17.6" stroke="#fff" stroke-width="1.2" opacity=".8"/><circle cx="12" cy="12" r="3.4" fill="#fff"/></svg>
    </div>
    <div class="logo-words">
      <div class="logo-cn">国联集团</div>
      <div class="logo-en">GUOLIAN GROUP</div>
    </div>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="card-emblem">
        <span class="dot">国</span><span>数字国联</span>
      </div>
      <h1>你好，欢迎登录</h1>
      <form id="loginForm" autocomplete="on">
        <div class="field">
          <input id="phone" type="tel" placeholder="手机号码/用户名" autocomplete="username" />
        </div>
        <div class="field">
          <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
          <button class="eye" type="button" id="eyeBtn" title="显示/隐藏密码" aria-label="显示或隐藏密码">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M2 12s3.6-6.2 10-6.2S22 12 22 12s-3.6 6.2-10 6.2S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>
            </svg>
          </button>
        </div>
        <button class="btn-login" id="loginBtn" type="submit">登 录</button>
        <div class="login-row">
          <a id="forgotLink">找回/设置密码</a>
          <label class="remember"><input type="checkbox" id="remember" checked />记住密码</label>
        </div>
        <div class="login-error" id="loginError"></div>
        <div class="download" id="downloadLink">下载数字国联APP<small>本机模拟环境：密码不做校验</small></div>
      </form>
    </div>
  </div>
</div>

<!-- ================= 应用中心 ================= -->
<div class="portal-page hidden" id="appView">
  <div class="shell">
    <div class="topbar">
      <div class="brand-inline"><span class="mark">国</span>数字国联</div>
      <nav class="nav">
        <a href="javascript:void(0)" class="mock-nav">首页</a>
        <a href="javascript:void(0)" class="mock-nav active">领导门户</a>
        <a href="javascript:void(0)" class="mock-nav">法律合规工作台</a>
        <a href="javascript:void(0)" class="mock-nav">验证下发</a>
        <a href="javascript:void(0)" class="mock-nav">工作台</a>
      </nav>
      <div class="spacer"></div>
      <div class="user-area">
        <span class="avatar" id="avatar">员</span>
        <span id="userName">--</span>
        <span id="userRole" style="opacity:.75"></span>
        <button id="logoutBtn" title="退出登录">退出</button>
      </div>
    </div>

    <div class="kpi-strip">
      <div class="kpi">
        <div class="val">300619105549.29<i>亿元</i></div>
        <div class="lbl">财务指标</div>
      </div>
      <div class="kpi">
        <div class="val">83966519661.82<i>元</i></div>
        <div class="lbl">利润总额</div>
      </div>
      <div class="kpi">
        <div class="val">8424012348.74<i>元</i></div>
        <div class="lbl">营业收入</div>
      </div>
      <div class="kpi">
        <div class="val">1504051805.68<i>人/元</i></div>
        <div class="lbl">人员指标</div>
      </div>
    </div>

    <div class="panels">
      <section class="panel">
        <h3>经营指标趋势 <span>2024-11 ~ 2025-04</span></h3>
        <div class="body">
          <svg viewBox="0 0 560 260" preserveAspectRatio="none">
            <g stroke="#EDF1F6" stroke-width="1">
              <line x1="66" y1="20" x2="548" y2="20"/><line x1="66" y1="70" x2="548" y2="70"/>
              <line x1="66" y1="120" x2="548" y2="120"/><line x1="66" y1="170" x2="548" y2="170"/>
              <line x1="66" y1="220" x2="548" y2="220"/>
            </g>
            <g font-size="9" fill="#9AA7B8">
              <text x="60" y="24" text-anchor="end">350619105549.29</text>
              <text x="60" y="74" text-anchor="end">300619105549.29</text>
              <text x="60" y="124" text-anchor="end">262964329161.97</text>
              <text x="60" y="174" text-anchor="end">175309552774.65</text>
              <text x="60" y="224" text-anchor="end">83966519661.82</text>
            </g>
            <polyline fill="none" stroke="#157DDD" stroke-width="2.4" stroke-linejoin="round"
              points="86,150 168,96 250,138 332,84 414,60 496,112"/>
            <polyline fill="none" stroke="#39B0A8" stroke-width="2.4" stroke-linejoin="round"
              points="86,196 168,170 250,186 332,152 414,142 496,168"/>
            <polyline fill="none" stroke="#F0A038" stroke-width="2.4" stroke-linejoin="round"
              points="86,214 168,206 250,210 332,192 414,186 496,198"/>
            <g fill="#157DDD">
              <circle cx="86" cy="150" r="3"/><circle cx="168" cy="96" r="3"/><circle cx="250" cy="138" r="3"/>
              <circle cx="332" cy="84" r="3"/><circle cx="414" cy="60" r="3"/><circle cx="496" cy="112" r="3"/>
            </g>
          </svg>
        </div>
        <div class="legend">
          <span><i style="background:#157DDD"></i>资产总额</span>
          <span><i style="background:#39B0A8"></i>净资产</span>
          <span><i style="background:#F0A038"></i>营业收入</span>
          <span><i style="background:#C7CFDB"></i>利润总额</span>
        </div>
      </section>

      <section class="panel">
        <h3>指标明细 <span>经营分析</span></h3>
        <div class="body">
          <div class="masked">
            <svg viewBox="0 0 64 64" fill="none" stroke="#C3CDDA" stroke-width="2">
              <rect x="12" y="24" width="40" height="28" rx="5"/><path d="M22 24v-7a10 10 0 0120 0v7"/>
              <circle cx="32" cy="37" r="3.2" fill="#C3CDDA" stroke="none"/><path d="M32 40v5"/>
            </svg>
            <div>您未获取查看权限，可联系管理员取得权限后查看</div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h3>资产结构 <span>单位：亿元</span></h3>
        <div class="body">
          <svg viewBox="0 0 420 260">
            <g transform="translate(140,124)">
              <circle r="86" fill="none" stroke="#EDF1F6" stroke-width="22"/>
              <circle r="86" fill="none" stroke="#157DDD" stroke-width="22"
                stroke-dasharray="196 540" transform="rotate(-90)"/>
              <circle r="86" fill="none" stroke="#4FB3E8" stroke-width="22"
                stroke-dasharray="126 540" stroke-dashoffset="-196" transform="rotate(-90)"/>
              <circle r="86" fill="none" stroke="#8FD0C9" stroke-width="22"
                stroke-dasharray="74 540" stroke-dashoffset="-322" transform="rotate(-90)"/>
              <circle r="86" fill="none" stroke="#F0A038" stroke-width="22"
                stroke-dasharray="48 540" stroke-dashoffset="-396" transform="rotate(-90)"/>
              <text y="-6" text-anchor="middle" font-size="13" fill="#8A94A6">合计</text>
              <text y="18" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2733">40 亿</text>
            </g>
            <g font-size="10" fill="#6B7A8F">
              <text x="252" y="46">40 亿</text>
              <text x="252" y="86">30 亿</text>
              <text x="252" y="126">20 亿</text>
              <text x="252" y="166">10 亿</text>
              <text x="252" y="206">0.00</text>
            </g>
            <g font-size="9" fill="#9AA7B8">
              <text x="26" y="248">2024-11</text><text x="104" y="248">2024-12</text>
              <text x="182" y="248">2025-01</text><text x="260" y="248">2025-02</text>
              <text x="338" y="248">2025-03</text>
            </g>
          </svg>
        </div>
      </section>
    </div>

    <div class="apps-wrap">
      <div class="apps-title">应用入口</div>
      <div class="apps" id="apps"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  var loginView = document.getElementById('loginView');
  var appView = document.getElementById('appView');
  var loginForm = document.getElementById('loginForm');
  var loginBtn = document.getElementById('loginBtn');
  var errorBox = document.getElementById('loginError');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  var state = { ticket: null, user: null, isAdmin: false };

  var PHONE_KEY = 'portal_phone';

  /* ---------------- 工具 ---------------- */
  function toastMsg(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function setError(text) {
    errorBox.textContent = text || '';
  }

  /* ---------------- 应用图标 ---------------- */
  var APPS = [
    { name: '单点出国境', color: 'linear-gradient(140deg,#4C8DF6,#2B5FD9)', glyph: 'globe' },
    { name: '国资产业管系统', color: 'linear-gradient(140deg,#5AC8A8,#22997C)', glyph: 'chart' },
    { name: '审计管理系统', color: 'linear-gradient(140deg,#7E8CF3,#4A54C7)', glyph: 'shield' },
    { name: '业务一体化系统', color: 'linear-gradient(140deg,#F0A038,#D3761A)', glyph: 'layers' },
    { name: '数字化管理系统', color: 'linear-gradient(140deg,#57B7F0,#2280BE)', glyph: 'grid' },
    { name: '人力资源管理系统', color: 'linear-gradient(140deg,#F2799C,#CF3E66)', glyph: 'user' },
    { name: '纪检监察业务', color: 'linear-gradient(140deg,#E0554B,#B71F1A)', glyph: 'flag', exam: true },
    { name: '信创出国境', color: 'linear-gradient(140deg,#8BB6E6,#4C7FBF)', glyph: 'doc' }
  ];

  var GLYPHS = {
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.3 3.6 8.5S14.4 18.2 12 20.5C9.6 18.2 8.4 15.2 8.4 12S9.6 5.8 12 3.5z"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19.5h16"/><rect x="5.5" y="12" width="3.4" height="7.5" rx="1"/><rect x="10.6" y="7.5" width="3.4" height="12" rx="1"/><rect x="15.7" y="4" width="3.4" height="15.5" rx="1"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 3l7 2.6v6.2c0 4.2-2.8 7.4-7 9.2-4.2-1.8-7-5-7-9.2V5.6z"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4"/></svg>',
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M12 3.5l8 4.2-8 4.2-8-4.2z"/><path d="M4 12.2l8 4.2 8-4.2"/><path d="M4 16.4l8 4.2 8-4.2"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="4" y="4" width="6.4" height="6.4" rx="1.4"/><rect x="13.6" y="4" width="6.4" height="6.4" rx="1.4"/><rect x="4" y="13.6" width="6.4" height="6.4" rx="1.4"/><rect x="13.6" y="13.6" width="6.4" height="6.4" rx="1.4"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20c.6-4 3.6-6.2 7.2-6.2s6.6 2.2 7.2 6.2"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M6 3.5v17"/><path d="M6 4.6h11.5l-1.9 3.8 1.9 3.8H6z"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M6 3.5h7.5L18 8v12.5H6z"/><path d="M13.5 3.5V8H18"/><path d="M9 12.5h6M9 16h4.5"/></svg>'
  };

  function renderApps() {
    var box = document.getElementById('apps');
    var html = '';
    APPS.forEach(function (app, idx) {
      html += '<div class="app' + (app.exam ? ' exam' : '') + '" data-idx="' + idx + '" title="' + app.name + '">'
        + '<div class="icon" style="background:' + app.color + '">' + GLYPHS[app.glyph] + '</div>'
        + '<div class="name">' + app.name + '</div>'
        + (app.exam ? '<div class="badge">考试系统</div>' : '')
        + '</div>';
    });
    box.innerHTML = html;
    box.addEventListener('click', function (e) {
      var el = e.target.closest('.app');
      if (!el) return;
      var app = APPS[Number(el.getAttribute('data-idx'))];
      if (!app) return;
      if (app.exam) {
        enterExam();
      } else {
        toastMsg(app.name + '：未接入本机模拟环境');
      }
    });
  }

  /* ---------------- 登录 ---------------- */
  function enterExam() {
    if (!state.ticket) { toastMsg('登录状态已失效，请重新登录'); return; }
    location.href = '/guolian-jijian/login?ticket=' + encodeURIComponent(state.ticket);
  }

  function showApps(data) {
    state.ticket = data.ticket;
    state.user = data;
    state.isAdmin = !!data.isAdmin;
    document.getElementById('userName').textContent = data.userName || ('员工' + (data.empId || ''));
    document.getElementById('userRole').textContent = state.isAdmin ? '管理员' : '员工';
    document.getElementById('avatar').textContent = state.isAdmin ? '管' : '员';
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var phone = document.getElementById('phone').value.trim();
    var password = document.getElementById('password').value;
    if (!phone) { setError('请输入手机号码/用户名'); return; }
    setError('');
    loginBtn.disabled = true;
    loginBtn.textContent = '登录中…';
    fetch('/api/v1/portal/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone, password: password })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || res.code !== 0) {
          setError((res && res.message) || '登录失败');
          return;
        }
        if (document.getElementById('remember').checked) {
          localStorage.setItem(PHONE_KEY, phone);
        } else {
          localStorage.removeItem(PHONE_KEY);
        }
        showApps(res.data);
      })
      .catch(function () { setError('网络异常，请稍后重试'); })
      .finally(function () {
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      });
  });

  document.getElementById('eyeBtn').addEventListener('click', function () {
    var pwd = document.getElementById('password');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('forgotLink').addEventListener('click', function () {
    toastMsg('本机模拟环境：请使用下方测试账号直接登录');
  });
  document.getElementById('downloadLink').addEventListener('click', function () {
    toastMsg('本机模拟环境：不提供 APP 下载');
  });
  document.getElementById('logoutBtn').addEventListener('click', function () {
    state.ticket = null; state.user = null;
    appView.classList.add('hidden');
    loginView.classList.remove('hidden');
    document.getElementById('password').value = '';
    setError('');
  });
  Array.prototype.forEach.call(document.querySelectorAll('.mock-nav'), function (a) {
    a.addEventListener('click', function () {
      toastMsg('菜单「' + a.textContent + '」为模拟展示');
    });
  });

  // 回填记住的手机号
  var savedPhone = localStorage.getItem(PHONE_KEY);
  if (savedPhone) { document.getElementById('phone').value = savedPhone; }

  renderApps();
})();
</script>
</body>
</html>
